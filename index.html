    <!--
      Single authority for theme + iOS status bar.
      - Computes effective theme from saved setting (light/dark/system) + OS (only in system mode)
      - Sets html class (dark/light) + auth-page override
      - Sets meta theme-color + color-scheme
      - Keeps overflow background stable
    -->
    <script>
      (function() {
        var LIGHT_COLOR = '#fafafa';
        var DARK_COLOR = '#121212';

        // Theme always follows system preference (no manual override)
        function getEffectiveIsDark() {
            return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        }

        function setMeta(name, value) {
          // Update ALL matching meta tags (iOS needs both theme-color tags updated)
          document.querySelectorAll('meta[name="' + name + '"]').forEach(function(el) {
            el.setAttribute('content', value);
          });
        }

        function computeThemeColor(isDark) {
          // Auth pages now also respect dark mode (no special override)
          return isDark ? DARK_COLOR : LIGHT_COLOR;
        }

        function applyTheme() {
          var html = document.documentElement;
          var isDark = getEffectiveIsDark();

          html.classList.toggle('dark', isDark);
          html.classList.toggle('light', !isDark);

          var color = computeThemeColor(isDark);

          // Set initial background to prevent flash
          html.style.setProperty('--initial-bg', color);
          html.style.backgroundColor = color;

          // Status bar - only update theme-color, leave color-scheme static as "light dark"
          // (CSS color-scheme property on html/html.dark handles the rest)
          setMeta('theme-color', color);

          return { isDark: isDark, color: color };
        }

        // Expose helpers for React code (Auth page class toggle)
        window.__helpyApplyTheme = applyTheme;
        window.__helpySetAuthPage = function(isAuth) {
          document.documentElement.classList.toggle('auth-page', !!isAuth);
          return applyTheme();
        };
        
        // Sheet overlay support - with black-translucent status bar,
        // the backdrop blur/dim naturally shows through, no color manipulation needed
        window.__helpySetSheetOpen = function(isOpen) {
          // No-op: transparent status bar shows backdrop naturally
        };

        // Initial apply (before React mounts)
        applyTheme();

        // Only react to relevant html class changes (dark/auth-page), avoid thrash from unrelated class mutations.
        var lastState = null;
        function stateKey() {
          var html = document.documentElement;
          return (html.classList.contains('dark') ? 'd' : 'l') + (html.classList.contains('auth-page') ? 'a' : 'n');
        }
        lastState = stateKey();

        var observer = new MutationObserver(function() {
          var next = stateKey();
          if (next === lastState) return;
          lastState = next;
          applyTheme();
        });
        observer.observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });

        // OS preference listener - always respond to system changes
        if (window.matchMedia) {
          var mql = window.matchMedia('(prefers-color-scheme: dark)');
          var osHandler = function() {
            applyTheme();
          };
          try {
            mql.addEventListener('change', osHandler);
          } catch (e) {
            // Safari < 14
            mql.addListener(osHandler);
          }
        }
      })();
    </script>

    <style>
      /* Light mode default */
      html, body, #root {
        background-color: var(--initial-bg, #fafafa);
      }
      /* Dark mode CSS fallback - applies immediately before JS runs */
      @media (prefers-color-scheme: dark) {
        html, body, #root {
          background-color: var(--initial-bg, #121212);
        }
      }
      /* JS-controlled dark mode (after theme is applied) */
      html.dark, html.dark body, html.dark #root {
        background-color: #121212 !important;
      }
      /* Auth pages now follow system theme - no forced light mode */
      #root:empty {
        min-height: 100vh;
        min-height: 100dvh;
      }
      .app-background {
        background: linear-gradient(180deg, #eef2ff 0%, #f8fafc 100%);
        min-height: 100vh;
      }
      .glass-surface {
        background: rgba(255, 255, 255, 0.75);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.3);
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      @keyframes fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes slide-up {
        from { transform: translateY(20px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      .animate-fade-in {
        animation: fade-in 0.3s ease-out backwards;
      }
      .animate-slide-up {
        animation: slide-up 0.3s ease-out;
      }
    </style>
