<!DOCTYPE html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <!-- Theme color for status bar - updated by JS to match app theme -->
    <meta name="theme-color" content="#fafafa" />
    <!-- Restore theme and set initial background before render to prevent flash -->
    <script>
      (function() {
        var saved = localStorage.getItem('helpy_theme') || 'system'; // Default to system
        var systemPrefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        
        // Determine if dark mode should be applied
        var isDark = saved === 'dark' || (saved === 'system' && systemPrefersDark);
        
        if (isDark) {
          document.documentElement.classList.remove('light');
          document.documentElement.classList.add('dark');
        }
        // Set background based on session state AND theme to prevent flash
        // Must match theme to avoid light leak through backdrop-blur headers
        var hasSession = !!localStorage.getItem('helpy_current_session_user');
        var bgColor = hasSession 
          ? (isDark ? '#121212' : '#fafafa')  // Match theme: dark=#121212, light=#fafafa
          : '#fafafa';  // No session: grey (auth screens have their own blue backgrounds)
        document.documentElement.style.setProperty('--initial-bg', bgColor);
        // Also set html background directly for overscroll
        document.documentElement.style.backgroundColor = bgColor;
        
        // Update theme-color meta tag immediately for iOS status bar
        var themeColorMeta = document.querySelector('meta[name="theme-color"]');
        if (themeColorMeta) {
          themeColorMeta.setAttribute('content', bgColor);
        }
        
        // Update color-scheme to match app theme (tells iOS which mode we're in)
        var colorSchemeMeta = document.querySelector('meta[name="color-scheme"]');
        if (colorSchemeMeta) {
          colorSchemeMeta.setAttribute('content', isDark ? 'dark' : 'light');
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- iOS specific: ensures status bar text adapts to background -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Helpy" />
    <!-- Additional iOS PWA meta tags for better recognition -->
    <meta name="apple-touch-fullscreen" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Block search engines from indexing the app (private user data) -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Helpy</title>
    
    <!-- Favicon for browsers -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    
    <!-- Apple Touch Icon for iOS home screen -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    
    <!-- Web App Manifest for Android/PWA -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        // Dark mode disabled temporarily - using 'class' mode so it only activates 
        // when <html> has class="dark". Currently set to "light" to force light mode.
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              // Brand colors aligned with Helpy design system
              brand: {
                primary: '#3EAFD2',
                secondary: '#2B9AC0',
                accent: '#f7f7f7',
                text: '#1a1a1a',
                muted: '#757575',
              },
              // New Design System Colors
              background: 'hsl(var(--background) / <alpha-value>)',
              foreground: 'hsl(var(--foreground) / <alpha-value>)',
              border: 'hsl(var(--border) / <alpha-value>)',
              input: 'hsl(var(--input) / <alpha-value>)',
              ring: 'hsl(var(--ring) / <alpha-value>)',
              card: {
                DEFAULT: 'hsl(var(--card) / <alpha-value>)',
                foreground: 'hsl(var(--card-foreground) / <alpha-value>)',
              },
              popover: {
                DEFAULT: 'hsl(var(--popover) / <alpha-value>)',
                foreground: 'hsl(var(--popover-foreground) / <alpha-value>)',
              },
              primary: {
                DEFAULT: 'hsl(var(--primary) / <alpha-value>)',
                foreground: 'hsl(var(--primary-foreground) / <alpha-value>)',
              },
              secondary: {
                DEFAULT: 'hsl(var(--secondary) / <alpha-value>)',
                foreground: 'hsl(var(--secondary-foreground) / <alpha-value>)',
              },
              muted: {
                DEFAULT: 'hsl(var(--muted) / <alpha-value>)',
                foreground: 'hsl(var(--muted-foreground) / <alpha-value>)',
              },
              accent: {
                DEFAULT: 'hsl(var(--accent) / <alpha-value>)',
                foreground: 'hsl(var(--accent-foreground) / <alpha-value>)',
              },
              destructive: {
                DEFAULT: 'hsl(var(--destructive) / <alpha-value>)',
                foreground: 'hsl(var(--destructive-foreground) / <alpha-value>)',
              },
            },
            fontFamily: {
              sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            },
            fontSize: {
              'display': ['2rem', { lineHeight: '1.2', letterSpacing: '-0.02em', fontWeight: '800' }],
              'title': ['1rem', { lineHeight: '1.4', letterSpacing: '-0.01em', fontWeight: '700' }],
              'body': ['0.875rem', { lineHeight: '1.5', fontWeight: '600' }],
              'caption': ['0.75rem', { lineHeight: '1.4', letterSpacing: '0.01em', fontWeight: '500' }],
              'micro': ['0.625rem', { lineHeight: '1.2', fontWeight: '600' }],
            },
            borderRadius: {
              'xl': '1.125rem',
              'lg': '0.75rem',
              'md': '0.5rem',
              'sm': '0.375rem',
            },
            boxShadow: {
              'sm': 'var(--shadow-sm)',
              'DEFAULT': 'var(--shadow)',
              'md': 'var(--shadow-md)',
              'lg': 'var(--shadow-lg)',
              'xl': 'var(--shadow-xl)',
              '2xl': 'var(--shadow-2xl)',
            },
          },
        },
      };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      /* CRITICAL: Prevent black flash during app load.
         This style loads before external CSS and React, ensuring there's always
         a visible background color. The --initial-bg is set by the inline script above. */
      html, body, #root {
        background-color: var(--initial-bg, #3EAFD2);
      }
      /* Dark mode overflow background - must be here to override inline JS styles */
      html.dark, html.dark body, html.dark #root {
        background-color: #121212 !important;
      }
      /* Auth pages - blue overflow background */
      html.auth-page, html.auth-page body, html.auth-page #root {
        background-color: #3EAFD2 !important;
      }
      /* Ensure root fills the viewport during React loading */
      #root:empty {
        min-height: 100vh;
        min-height: 100dvh;
      }
      /* Legacy styles - kept for backward compatibility with other pages */
      .app-background {
        background: linear-gradient(180deg, #eef2ff 0%, #f8fafc 100%);
        min-height: 100vh;
      }
      .glass-surface {
        background: rgba(255, 255, 255, 0.75);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.3);
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      @keyframes fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes slide-up {
        from { transform: translateY(20px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      .animate-fade-in {
        animation: fade-in 0.3s ease-out backwards;
      }
      .animate-slide-up {
        animation: slide-up 0.3s ease-out;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
      // Dynamic theme-color and color-scheme sync for class-based dark mode
      (function() {
        const LIGHT_COLOR = '#fafafa';  // hsl(0 0% 98%)
        const DARK_COLOR = '#121212';   // hsl(0 0% 7%)
        
        function applyTheme(isDark) {
          const html = document.documentElement;
          if (isDark) {
            html.classList.remove('light');
            html.classList.add('dark');
          } else {
            html.classList.remove('dark');
            html.classList.add('light');
          }
        }
        
        function updateThemeColor() {
          const isDark = document.documentElement.classList.contains('dark');
          const color = isDark ? DARK_COLOR : LIGHT_COLOR;
          
          // Update theme-color meta tag to match app theme
          const themeColorMeta = document.querySelector('meta[name="theme-color"]');
          if (themeColorMeta) {
            themeColorMeta.setAttribute('content', color);
          }
          
          // Update color-scheme to match app theme (tells iOS which mode we're in)
          const colorSchemeMeta = document.querySelector('meta[name="color-scheme"]');
          if (colorSchemeMeta) {
            colorSchemeMeta.setAttribute('content', isDark ? 'dark' : 'light');
          }
          
          // Update html background color for overscroll
          document.documentElement.style.backgroundColor = color;
        }
        
        // Initial update
        updateThemeColor();
        
        // Watch for class changes on <html>
        const observer = new MutationObserver(mutations => {
          mutations.forEach(mutation => {
            if (mutation.attributeName === 'class') {
              updateThemeColor();
            }
          });
        });
        
        observer.observe(document.documentElement, { attributes: true });
        
        // Listen for OS preference changes (only applies when theme is 'system')
        if (window.matchMedia) {
          window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
            const savedTheme = localStorage.getItem('helpy_theme') || 'system';
            if (savedTheme === 'system') {
              applyTheme(e.matches);
            }
          });
        }
      })();
    </script>
  </body>
</html>
