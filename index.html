<!DOCTYPE html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- color-scheme: light dark tells iOS we support both; JS will override theme-color dynamically -->
    <meta name="color-scheme" content="light dark" />
    <!-- Two theme-color tags with media queries - iOS needs both; JS updates ALL of them to match app theme -->
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)" />
    <!-- iOS specific: ensures status bar text adapts to background -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Helpy" />
    <!-- Additional iOS PWA meta tags for better recognition -->
    <meta name="apple-touch-fullscreen" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Block search engines from indexing the app (private user data) -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Helpy</title>
    
    <!-- Favicon for browsers -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    
    <!-- Apple Touch Icon for iOS home screen -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    
    <!-- Web App Manifest for Android/PWA -->
    <link rel="manifest" href="/manifest.json" />

    <!--
      Single authority for theme + iOS status bar.
      - Computes effective theme from saved setting (light/dark/system) + OS (only in system mode)
      - Sets html class (dark/light) + auth-page override
      - Sets meta theme-color + color-scheme
      - Keeps overflow background stable
    -->
    <script>
      (function() {
        var THEME_KEY = 'helpy_theme';
        var LIGHT_COLOR = '#fafafa';
        var DARK_COLOR = '#121212';
        var AUTH_COLOR = '#3EAFD2';

        function getSavedTheme() {
          var t = localStorage.getItem(THEME_KEY);
          if (t === 'light' || t === 'dark' || t === 'system') return t;
          return 'light'; // Default
        }

        function getEffectiveIsDark(savedTheme) {
          if (savedTheme === 'dark') return true;
          if (savedTheme === 'system') {
            return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          }
          return false;
        }

        function setMeta(name, value) {
          // Update ALL matching meta tags (iOS needs both theme-color tags updated)
          document.querySelectorAll('meta[name="' + name + '"]').forEach(function(el) {
            el.setAttribute('content', value);
          });
        }

        function computeThemeColor(isDark) {
          var html = document.documentElement;
          var isAuth = html.classList.contains('auth-page');
          if (isAuth) return AUTH_COLOR;
          return isDark ? DARK_COLOR : LIGHT_COLOR;
        }

        function applyTheme() {
          var html = document.documentElement;
          var savedTheme = getSavedTheme();
          var isDark = getEffectiveIsDark(savedTheme);

          html.classList.toggle('dark', isDark);
          html.classList.toggle('light', !isDark);

          var color = computeThemeColor(isDark);

          // Set initial background to prevent flash (session-aware not needed here; auth-page handles its own)
          html.style.setProperty('--initial-bg', color);
          html.style.backgroundColor = color;

          // Status bar - only update theme-color, leave color-scheme static as "light dark"
          // (CSS color-scheme property on html/html.dark handles the rest)
          setMeta('theme-color', color);

          return { savedTheme: savedTheme, isDark: isDark, color: color };
        }

        // Expose helpers for React code (Profile/Auth)
        window.__helpyApplyTheme = applyTheme;
        window.__helpySetAuthPage = function(isAuth) {
          document.documentElement.classList.toggle('auth-page', !!isAuth);
          return applyTheme();
        };
        // debug helpers removed

        // Initial apply (before React mounts)
        applyTheme();

        // Only react to relevant html class changes (dark/auth-page), avoid thrash from unrelated class mutations.
        var lastState = null;
        function stateKey() {
          var html = document.documentElement;
          return (html.classList.contains('dark') ? 'd' : 'l') + (html.classList.contains('auth-page') ? 'a' : 'n');
        }
        lastState = stateKey();

        var observer = new MutationObserver(function() {
          var next = stateKey();
          if (next === lastState) return;
          lastState = next;
          applyTheme();
        });
        observer.observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });

        // OS preference listener for System mode
        if (window.matchMedia) {
          var mql = window.matchMedia('(prefers-color-scheme: dark)');
          var osHandler = function() {
            if (getSavedTheme() === 'system') applyTheme();
          };
          try {
            mql.addEventListener('change', osHandler);
          } catch (e) {
            // Safari < 14
            mql.addListener(osHandler);
          }
        }
      })();
    </script>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: {
                primary: '#3EAFD2',
                secondary: '#2B9AC0',
                accent: '#f7f7f7',
                text: '#1a1a1a',
                muted: '#757575',
              },
              background: 'hsl(var(--background) / <alpha-value>)',
              foreground: 'hsl(var(--foreground) / <alpha-value>)',
              border: 'hsl(var(--border) / <alpha-value>)',
              input: 'hsl(var(--input) / <alpha-value>)',
              ring: 'hsl(var(--ring) / <alpha-value>)',
              card: {
                DEFAULT: 'hsl(var(--card) / <alpha-value>)',
                foreground: 'hsl(var(--card-foreground) / <alpha-value>)',
              },
              popover: {
                DEFAULT: 'hsl(var(--popover) / <alpha-value>)',
                foreground: 'hsl(var(--popover-foreground) / <alpha-value>)',
              },
              primary: {
                DEFAULT: 'hsl(var(--primary) / <alpha-value>)',
                foreground: 'hsl(var(--primary-foreground) / <alpha-value>)',
              },
              secondary: {
                DEFAULT: 'hsl(var(--secondary) / <alpha-value>)',
                foreground: 'hsl(var(--secondary-foreground) / <alpha-value>)',
              },
              muted: {
                DEFAULT: 'hsl(var(--muted) / <alpha-value>)',
                foreground: 'hsl(var(--muted-foreground) / <alpha-value>)',
              },
              accent: {
                DEFAULT: 'hsl(var(--accent) / <alpha-value>)',
                foreground: 'hsl(var(--accent-foreground) / <alpha-value>)',
              },
              destructive: {
                DEFAULT: 'hsl(var(--destructive) / <alpha-value>)',
                foreground: 'hsl(var(--destructive-foreground) / <alpha-value>)',
              },
            },
            fontFamily: {
              sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            },
            fontSize: {
              'display': ['2rem', { lineHeight: '1.2', letterSpacing: '-0.02em', fontWeight: '800' }],
              'title': ['1rem', { lineHeight: '1.4', letterSpacing: '-0.01em', fontWeight: '700' }],
              'body': ['0.875rem', { lineHeight: '1.5', fontWeight: '600' }],
              'caption': ['0.75rem', { lineHeight: '1.4', letterSpacing: '0.01em', fontWeight: '500' }],
              'micro': ['0.625rem', { lineHeight: '1.2', fontWeight: '600' }],
            },
            borderRadius: {
              'xl': '1.125rem',
              'lg': '0.75rem',
              'md': '0.5rem',
              'sm': '0.375rem',
            },
            boxShadow: {
              'sm': 'var(--shadow-sm)',
              'DEFAULT': 'var(--shadow)',
              'md': 'var(--shadow-md)',
              'lg': 'var(--shadow-lg)',
              'xl': 'var(--shadow-xl)',
              '2xl': 'var(--shadow-2xl)',
            },
          },
        },
      };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      html, body, #root {
        background-color: var(--initial-bg, #fafafa);
      }
      html.dark, html.dark body, html.dark #root {
        background-color: #121212 !important;
      }
      html.auth-page, html.auth-page body, html.auth-page #root {
        background-color: #3EAFD2 !important;
      }
      #root:empty {
        min-height: 100vh;
        min-height: 100dvh;
      }
      .app-background {
        background: linear-gradient(180deg, #eef2ff 0%, #f8fafc 100%);
        min-height: 100vh;
      }
      .glass-surface {
        background: rgba(255, 255, 255, 0.75);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.3);
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      @keyframes fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes slide-up {
        from { transform: translateY(20px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      .animate-fade-in {
        animation: fade-in 0.3s ease-out backwards;
      }
      .animate-slide-up {
        animation: slide-up 0.3s ease-out;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
