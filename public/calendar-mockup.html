<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Helpy Calendar Mockup</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg-primary: #0f1419;
      --bg-secondary: #1a1f26;
      --bg-tertiary: #252b33;
      --text-primary: #ffffff;
      --text-secondary: #8b949e;
      --text-muted: #6e7681;
      --accent-blue: #58a6ff;
      --accent-orange: #f0883e;
      --accent-green: #3fb950;
      --accent-purple: #a371f7;
      --accent-red: #f85149;
      --border-color: #30363d;
      --today-bg: rgba(88, 166, 255, 0.15);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Header */
    .header {
      position: sticky;
      top: 0;
      background: var(--bg-primary);
      padding: 16px;
      border-bottom: 1px solid var(--border-color);
      z-index: 100;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .header-title {
      font-size: 24px;
      font-weight: 600;
    }

    .today-btn {
      background: var(--accent-blue);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }

    /* View Toggle */
    .view-toggle {
      display: flex;
      background: var(--bg-secondary);
      border-radius: 10px;
      padding: 4px;
      gap: 4px;
    }

    .view-btn {
      flex: 1;
      padding: 10px 16px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 500;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .view-btn.active {
      background: var(--accent-blue);
      color: white;
    }

    /* Month Navigation */
    .month-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
    }

    .month-nav button {
      background: var(--bg-secondary);
      border: none;
      color: var(--text-primary);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .month-nav span {
      font-size: 18px;
      font-weight: 600;
    }

    /* Month View */
    .month-view {
      padding: 0 16px;
    }

    .weekday-header {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      padding: 8px 0;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 500;
    }

    .month-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
    }

    .day-cell {
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4px;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s;
      position: relative;
    }

    .day-cell:hover {
      background: var(--bg-secondary);
    }

    .day-cell.today {
      background: var(--today-bg);
    }

    .day-cell.selected {
      background: var(--accent-blue);
    }

    .day-cell.other-month {
      color: var(--text-muted);
    }

    .day-number {
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 4px;
    }

    .day-dots {
      display: flex;
      gap: 3px;
      min-height: 6px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }

    .dot.task { background: var(--accent-blue); }
    .dot.meal { background: var(--accent-orange); }
    .dot.expense { background: var(--accent-green); }

    /* Week View - Table-based with frozen row/column */
    .week-view {
      display: none;
      height: calc(100vh - 140px);
      overflow: hidden;
    }

    .week-view.active {
      display: flex;
      flex-direction: column;
    }

    /* Days Toggle (3/7 days) */
    .days-toggle {
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 0 16px 12px;
      flex-shrink: 0;
    }

    .days-toggle-btn {
      padding: 6px 16px;
      border: 1px solid var(--border-color);
      background: transparent;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 500;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .days-toggle-btn.active {
      background: var(--accent-blue);
      border-color: var(--accent-blue);
      color: white;
    }

    /* Week Table Container - scrollable both directions */
    .week-table-container {
      flex: 1;
      min-height: 0;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
    }

    /* Week Table */
    .week-table {
      border-collapse: separate;
      border-spacing: 0;
      table-layout: fixed;
      width: 100%;
      min-width: 500px;
    }

    /* Column widths */
    .week-table col.label-col {
      width: 70px;
      min-width: 70px;
    }

    .week-table col.day-col {
      min-width: 100px;
    }

    /* Frozen header row */
    .week-table thead {
      position: sticky;
      top: 0;
      z-index: 20;
    }

    /* Corner cell - frozen both ways */
    .week-table .corner-cell {
      position: sticky;
      left: 0;
      z-index: 25;
      background: var(--bg-primary);
      border-bottom: 1px solid var(--border-color);
      border-right: 1px solid var(--border-color);
    }

    /* Day header cells */
    .week-table .day-header {
      text-align: center;
      padding: 8px 4px;
      background: var(--bg-primary);
      border-bottom: 1px solid var(--border-color);
      border-right: 1px solid var(--border-color);
    }

    .week-table .day-header:last-child {
      border-right: none;
    }

    .week-day-name {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .week-day-num {
      font-size: 18px;
      font-weight: 600;
      margin-top: 4px;
    }

    .week-table .day-header.today .week-day-num {
      background: var(--accent-blue);
      color: white;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 2px;
    }

    /* Row label cells - frozen left column */
    .week-table .row-label {
      position: sticky;
      left: 0;
      z-index: 15;
      font-size: 10px;
      color: var(--text-muted);
      padding: 6px 4px;
      text-align: center;
      border-right: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
      vertical-align: top;
      cursor: pointer;
      user-select: none;
      transition: background 0.2s;
    }

    .week-table .row-label:hover {
      background: var(--bg-tertiary);
    }

    .week-table .row-label .label-content {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .week-table .row-label .collapse-icon {
      font-size: 8px;
      transition: transform 0.2s;
    }

    .week-table .row-label.collapsed .collapse-icon {
      transform: rotate(-90deg);
    }

    /* Section rows - different backgrounds */
    .week-table .meals-row .row-label {
      background: var(--bg-secondary);
    }

    .week-table .shopping-row .row-label {
      background: var(--bg-tertiary);
    }

    .week-table .holiday-row .row-label {
      background: rgba(248, 81, 73, 0.15);
    }

    .week-table .time-row .row-label {
      background: var(--bg-primary);
      text-align: right;
      padding-right: 8px;
    }

    /* Content cells */
    .week-table .content-cell {
      padding: 4px 2px;
      border-right: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
      vertical-align: top;
      min-height: 40px;
    }

    .week-table .content-cell:last-child {
      border-right: none;
    }

    /* Section row backgrounds */
    .week-table .meals-row .content-cell {
      background: var(--bg-secondary);
    }

    .week-table .shopping-row .content-cell {
      background: var(--bg-tertiary);
    }

    .week-table .holiday-row .content-cell {
      background: rgba(248, 81, 73, 0.08);
    }

    .week-table .time-row .content-cell {
      background: var(--bg-primary);
      height: 60px;
      position: relative;
    }

    .week-table .time-row .content-cell.today-col {
      background: var(--today-bg);
    }

    /* Collapsed rows */
    .week-table tr.collapsed .content-cell {
      padding: 0;
      height: 0;
      min-height: 0;
      overflow: hidden;
    }

    .week-table tr.collapsed .content-cell .cell-content {
      display: none;
    }

    /* Cell content wrapper */
    .cell-content {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    /* All-day events */
    .all-day-event {
      font-size: 10px;
      padding: 3px 6px;
      border-radius: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 500;
    }

    .all-day-event.meal {
      background: var(--accent-orange);
      color: white;
    }

    .all-day-event.shopping {
      background: var(--accent-purple);
      color: white;
      cursor: pointer;
    }

    .all-day-event.shopping:hover {
      opacity: 0.9;
    }

    .all-day-event.task-allday {
      background: var(--accent-blue);
      color: white;
    }

    .all-day-event.holiday {
      background: var(--accent-red, #f85149);
      color: white;
    }

    /* Time-based Events */
    .time-event {
      position: absolute;
      left: 2px;
      right: 2px;
      background: var(--accent-blue);
      border-radius: 4px;
      padding: 4px 6px;
      font-size: 10px;
      font-weight: 500;
      color: white;
      overflow: hidden;
      z-index: 10;
    }

    .time-event .event-time {
      font-size: 9px;
      opacity: 0.8;
    }

    .time-event .event-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Day View */
    .day-view {
      display: none;
      padding: 16px;
    }

    .day-view.active {
      display: block;
    }

    .day-view-date {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-color);
    }

    .day-section {
      margin-bottom: 24px;
    }

    .day-section-title {
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 12px;
      font-weight: 600;
    }

    .day-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px;
      background: var(--bg-secondary);
      border-radius: 12px;
      margin-bottom: 8px;
    }

    .day-item-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 4px;
    }

    .day-item-content {
      flex: 1;
    }

    .day-item-title {
      font-size: 15px;
      font-weight: 500;
      margin-bottom: 4px;
    }

    .day-item-meta {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .day-item-time {
      font-size: 13px;
      color: var(--text-muted);
      min-width: 50px;
      text-align: right;
    }

    /* Selected Day Panel (shown in month view) */
    .selected-day-panel {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--bg-secondary);
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      padding: 20px;
      max-height: 40vh;
      overflow-y: auto;
      transform: translateY(100%);
      transition: transform 0.3s ease;
      z-index: 200;
    }

    .selected-day-panel.open {
      transform: translateY(0);
    }

    .panel-handle {
      width: 40px;
      height: 4px;
      background: var(--border-color);
      border-radius: 2px;
      margin: 0 auto 16px;
    }

    .panel-date {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
    }

    .panel-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-color);
    }

    .panel-item:last-child {
      border-bottom: none;
    }

    .panel-item-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .panel-item-icon.meal { background: rgba(240, 136, 62, 0.2); }
    .panel-item-icon.task { background: rgba(88, 166, 255, 0.2); }
    .panel-item-icon.expense { background: rgba(63, 185, 80, 0.2); }

    /* Backdrop */
    .backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      z-index: 150;
    }

    .backdrop.visible {
      opacity: 1;
      pointer-events: auto;
    }

    /* Legend */
    .legend {
      display: flex;
      justify-content: center;
      gap: 16px;
      padding: 16px;
      border-top: 1px solid var(--border-color);
      margin-top: 16px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    /* Hide scrollbar */
    ::-webkit-scrollbar {
      display: none;
    }

    /* Responsive */
    @media (max-width: 400px) {
      .day-number {
        font-size: 12px;
      }
      .dot {
        width: 4px;
        height: 4px;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-top">
      <h1 class="header-title">Calendar</h1>
      <button class="today-btn" onclick="goToToday()">Today</button>
    </div>
    <div class="view-toggle">
      <button class="view-btn" data-view="day" onclick="switchView('day')">Day</button>
      <button class="view-btn" data-view="week" onclick="switchView('week')">Week</button>
      <button class="view-btn active" data-view="month" onclick="switchView('month')">Month</button>
    </div>
  </div>

  <!-- Month View -->
  <div id="monthView" class="month-view">
    <div class="month-nav">
      <button onclick="prevMonth()">‹</button>
      <span id="monthLabel">January 2026</span>
      <button onclick="nextMonth()">›</button>
    </div>
    <div class="weekday-header">
      <div>Sun</div>
      <div>Mon</div>
      <div>Tue</div>
      <div>Wed</div>
      <div>Thu</div>
      <div>Fri</div>
      <div>Sat</div>
    </div>
    <div id="monthGrid" class="month-grid"></div>
    <div class="legend">
      <div class="legend-item">
        <div class="legend-dot" style="background: var(--accent-blue)"></div>
        <span>Tasks</span>
      </div>
      <div class="legend-item">
        <div class="legend-dot" style="background: var(--accent-orange)"></div>
        <span>Meals</span>
      </div>
      <div class="legend-item">
        <div class="legend-dot" style="background: var(--accent-purple)"></div>
        <span>Shopping</span>
      </div>
      <div class="legend-item">
        <div class="legend-dot" style="background: var(--accent-red)"></div>
        <span>Holiday</span>
      </div>
    </div>
  </div>

  <!-- Week View -->
  <div id="weekView" class="week-view">
    <div class="month-nav">
      <button onclick="prevPeriod()">‹</button>
      <span id="weekLabel">Jan 26 - Feb 1, 2026</span>
      <button onclick="nextPeriod()">›</button>
    </div>
    <div class="days-toggle">
      <button class="days-toggle-btn" data-days="3" onclick="setDaysCount(3)">3 Days</button>
      <button class="days-toggle-btn active" data-days="7" onclick="setDaysCount(7)">7 Days</button>
    </div>
    <!-- Scrollable table container -->
    <div class="week-table-container" id="weekTableContainer">
      <table class="week-table" id="weekTable">
        <colgroup id="weekColgroup">
          <!-- Columns will be rendered dynamically -->
        </colgroup>
        <thead id="weekTableHead">
          <!-- Header row will be rendered dynamically -->
        </thead>
        <tbody id="weekTableBody">
          <!-- Body rows will be rendered dynamically -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- Day View -->
  <div id="dayView" class="day-view">
    <div class="day-view-date" id="dayViewDate">Monday, January 26, 2026</div>
    <div id="dayViewContent"></div>
  </div>

  <!-- Selected Day Panel (for month view) -->
  <div class="backdrop" id="backdrop" onclick="closePanel()"></div>
  <div class="selected-day-panel" id="selectedDayPanel">
    <div class="panel-handle"></div>
    <div class="panel-date" id="panelDate">Monday, January 26</div>
    <div id="panelContent"></div>
  </div>

  <script>
    // ============================================================================
    // DEMO DATA
    // ============================================================================
    
    const today = new Date();
    const formatDate = (d) => d.toISOString().split('T')[0];
    const addDays = (d, n) => { const r = new Date(d); r.setDate(r.getDate() + n); return r; };
    
    // Tasks with due dates and times
    const tasks = [
      { id: 1, name: 'Vacuum living room', date: formatDate(today), time: '09:00', assignee: 'Anna' },
      { id: 2, name: 'Pick up Ethan from school', date: formatDate(today), time: '15:30', assignee: 'Anna' },
      { id: 3, name: 'Prepare dinner ingredients', date: formatDate(today), time: '16:00', assignee: 'Anna' },
      { id: 4, name: 'Water plants', date: formatDate(addDays(today, 1)), time: '08:00', assignee: 'Anna' },
      { id: 5, name: 'Grocery shopping', date: formatDate(addDays(today, 1)), time: '10:00', assignee: 'Anna' },
      { id: 6, name: 'Clean bathroom', date: formatDate(addDays(today, 2)), time: '09:00', assignee: 'Anna' },
      { id: 7, name: 'Take grandma to doctor', date: formatDate(addDays(today, 2)), time: '14:00', assignee: 'Michelle' },
      { id: 8, name: 'Laundry', date: formatDate(addDays(today, 3)), time: '08:00', assignee: 'Anna' },
      { id: 9, name: 'Iron clothes', date: formatDate(addDays(today, 3)), time: '10:00', assignee: 'Anna' },
      { id: 10, name: 'Birthday party', date: formatDate(addDays(today, 5)), time: '12:00', assignee: 'Everyone' },
      { id: 11, name: 'Deep clean refrigerator', date: formatDate(addDays(today, 7)), time: '09:00', assignee: 'Anna' },
      { id: 12, name: 'Pay rent', date: formatDate(addDays(today, 10)), time: null, assignee: 'David' },
    ];
    
    // Meals
    const meals = [
      // Today
      { id: 1, date: formatDate(today), type: 'Breakfast', desc: 'Congee with Century Egg' },
      { id: 2, date: formatDate(today), type: 'Lunch', desc: 'Char Siu Rice' },
      { id: 3, date: formatDate(today), type: 'Dinner', desc: 'Steamed Fish with Ginger' },
      // Tomorrow
      { id: 4, date: formatDate(addDays(today, 1)), type: 'Breakfast', desc: 'Dim Sum Variety' },
      { id: 5, date: formatDate(addDays(today, 1)), type: 'Lunch', desc: 'Wonton Noodle Soup' },
      { id: 6, date: formatDate(addDays(today, 1)), type: 'Dinner', desc: 'Braised Pork Belly' },
      // Day after
      { id: 7, date: formatDate(addDays(today, 2)), type: 'Breakfast', desc: 'Toast & Eggs' },
      { id: 8, date: formatDate(addDays(today, 2)), type: 'Dinner', desc: 'Hot Pot' },
      // More days
      { id: 9, date: formatDate(addDays(today, 3)), type: 'Breakfast', desc: 'Milk & Cereal' },
      { id: 10, date: formatDate(addDays(today, 3)), type: 'Lunch', desc: 'Sandwich' },
      { id: 11, date: formatDate(addDays(today, 3)), type: 'Dinner', desc: 'Spaghetti Bolognese' },
      { id: 12, date: formatDate(addDays(today, 4)), type: 'Dinner', desc: 'Roast Chicken' },
      { id: 13, date: formatDate(addDays(today, 5)), type: 'Lunch', desc: 'Birthday Cake! 🎂' },
      { id: 14, date: formatDate(addDays(today, 5)), type: 'Dinner', desc: 'BBQ Party' },
      { id: 15, date: formatDate(addDays(today, 6)), type: 'Dinner', desc: 'Leftover BBQ' },
    ];
    
    // Shopping Items (no dates - always shown on "today")
    const shoppingItems = [
      { id: 1, name: 'Eggs (1 dozen)', category: 'Supermarket', completed: false },
      { id: 2, name: 'Milk 2L', category: 'Supermarket', completed: false },
      { id: 3, name: 'Fresh salmon', category: 'Wet Market', completed: false },
      { id: 4, name: 'Bok choy', category: 'Wet Market', completed: false },
      { id: 5, name: 'Rice 5kg', category: 'Supermarket', completed: false },
      { id: 6, name: 'Soy sauce', category: 'Supermarket', completed: true },
      { id: 7, name: 'Garlic', category: 'Wet Market', completed: false },
      { id: 8, name: 'Cooking oil', category: 'Supermarket', completed: false },
    ];
    
    // Helper Holidays (approved leave)
    const helperHolidays = [
      // Anna's holidays
      { id: 1, helperName: 'Anna', startDate: formatDate(addDays(today, 3)), endDate: formatDate(addDays(today, 5)), type: 'annual', status: 'approved' },
      // Maria's holidays (second helper)
      { id: 2, helperName: 'Maria', startDate: formatDate(addDays(today, 10)), endDate: formatDate(addDays(today, 12)), type: 'annual', status: 'approved' },
      // Anna's single day
      { id: 3, helperName: 'Anna', startDate: formatDate(addDays(today, 14)), endDate: formatDate(addDays(today, 14)), type: 'sick', status: 'approved' },
    ];
    
    // Helper to check if a date falls within a holiday range
    function isDateInHoliday(dateStr, holiday) {
      return dateStr >= holiday.startDate && dateStr <= holiday.endDate;
    }
    
    // Get holidays for a specific date
    function getHolidaysForDate(dateStr) {
      return helperHolidays.filter(h => isDateInHoliday(dateStr, h) && h.status === 'approved');
    }
    
    // ============================================================================
    // STATE
    // ============================================================================
    
    let currentView = 'month';
    let currentMonth = new Date(today.getFullYear(), today.getMonth(), 1);
    let currentWeekStart = getWeekStart(today);
    let currentPeriodStart = new Date(today); // For 3-day view, starts from selected date
    let selectedDate = formatDate(today);
    let daysCount = 7; // 3 or 7
    
    function getWeekStart(d) {
      const result = new Date(d);
      const day = result.getDay();
      result.setDate(result.getDate() - day);
      return result;
    }
    
    function setDaysCount(count) {
      daysCount = count;
      document.querySelectorAll('.days-toggle-btn').forEach(btn => {
        btn.classList.toggle('active', parseInt(btn.dataset.days) === count);
      });
      
      // For 3-day view, center on today
      if (count === 3) {
        currentPeriodStart = addDays(today, -1); // Yesterday, today, tomorrow
      } else {
        currentPeriodStart = getWeekStart(today);
      }
      
      renderWeekView();
    }
    
    // ============================================================================
    // VIEW SWITCHING
    // ============================================================================
    
    function switchView(view) {
      currentView = view;
      document.querySelectorAll('.view-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.view === view);
      });
      document.getElementById('monthView').style.display = view === 'month' ? 'block' : 'none';
      document.getElementById('weekView').classList.toggle('active', view === 'week');
      document.getElementById('dayView').classList.toggle('active', view === 'day');
      
      if (view === 'week') renderWeekView();
      if (view === 'day') renderDayView();
      if (view === 'month') renderMonthGrid();
    }
    
    // ============================================================================
    // MONTH VIEW
    // ============================================================================
    
    function renderMonthGrid() {
      const grid = document.getElementById('monthGrid');
      grid.innerHTML = '';
      
      const year = currentMonth.getFullYear();
      const month = currentMonth.getMonth();
      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const daysInPrevMonth = new Date(year, month, 0).getDate();
      
      document.getElementById('monthLabel').textContent = 
        currentMonth.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
      
      // Previous month days
      for (let i = firstDay - 1; i >= 0; i--) {
        const day = daysInPrevMonth - i;
        const date = new Date(year, month - 1, day);
        grid.appendChild(createDayCell(date, true));
      }
      
      // Current month days
      for (let day = 1; day <= daysInMonth; day++) {
        const date = new Date(year, month, day);
        grid.appendChild(createDayCell(date, false));
      }
      
      // Next month days
      const totalCells = grid.children.length;
      const remaining = 42 - totalCells;
      for (let day = 1; day <= remaining; day++) {
        const date = new Date(year, month + 1, day);
        grid.appendChild(createDayCell(date, true));
      }
    }
    
    function createDayCell(date, isOtherMonth) {
      const cell = document.createElement('div');
      cell.className = 'day-cell';
      if (isOtherMonth) cell.classList.add('other-month');
      const isToday = formatDate(date) === formatDate(today);
      if (isToday) cell.classList.add('today');
      if (formatDate(date) === selectedDate) cell.classList.add('selected');
      
      const dateStr = formatDate(date);
      const dayTasks = tasks.filter(t => t.date === dateStr);
      const dayMeals = meals.filter(m => m.date === dateStr);
      // Shopping only shows on today
      const hasUncompleted = shoppingItems.filter(s => !s.completed).length > 0;
      
      cell.innerHTML = `
        <div class="day-number">${date.getDate()}</div>
        <div class="day-dots">
          ${dayTasks.length > 0 ? '<div class="dot task"></div>' : ''}
          ${dayMeals.length > 0 ? '<div class="dot meal"></div>' : ''}
          ${isToday && hasUncompleted ? '<div class="dot" style="background:var(--accent-purple)"></div>' : ''}
        </div>
      `;
      
      cell.onclick = () => selectDay(date);
      return cell;
    }
    
    function selectDay(date) {
      selectedDate = formatDate(date);
      renderMonthGrid();
      showDayPanel(date);
    }
    
    function showDayPanel(date) {
      const dateStr = formatDate(date);
      const dayTasks = tasks.filter(t => t.date === dateStr);
      const dayMeals = meals.filter(m => m.date === dateStr);
      const isToday = formatDate(date) === formatDate(today);
      const uncompletedShopping = shoppingItems.filter(s => !s.completed);
      
      document.getElementById('panelDate').textContent = 
        date.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
      
      let content = '';
      
      dayMeals.forEach(m => {
        content += `
          <div class="panel-item">
            <div class="panel-item-icon meal">🍽️</div>
            <div style="flex:1">
              <div style="font-weight:500">${m.desc}</div>
              <div style="font-size:13px;color:var(--text-secondary)">${m.type}</div>
            </div>
          </div>
        `;
      });
      
      dayTasks.forEach(t => {
        content += `
          <div class="panel-item">
            <div class="panel-item-icon task">✓</div>
            <div style="flex:1">
              <div style="font-weight:500">${t.name}</div>
              <div style="font-size:13px;color:var(--text-secondary)">${t.assignee}</div>
            </div>
            ${t.time ? `<div style="color:var(--text-muted);font-size:13px">${t.time}</div>` : ''}
          </div>
        `;
      });
      
      // Shopping only shown on today
      if (isToday && uncompletedShopping.length > 0) {
        content += `
          <div class="panel-item" style="background:rgba(163,113,247,0.1);border-radius:8px;padding:12px;margin-top:8px;">
            <div class="panel-item-icon" style="background:rgba(163,113,247,0.2)">🛒</div>
            <div style="flex:1">
              <div style="font-weight:500">${uncompletedShopping.length} shopping items</div>
              <div style="font-size:13px;color:var(--text-secondary)">Tap to view list</div>
            </div>
          </div>
        `;
      }
      
      if (!content) {
        content = '<div style="text-align:center;color:var(--text-muted);padding:20px">No events</div>';
      }
      
      document.getElementById('panelContent').innerHTML = content;
      document.getElementById('selectedDayPanel').classList.add('open');
      document.getElementById('backdrop').classList.add('visible');
    }
    
    function closePanel() {
      document.getElementById('selectedDayPanel').classList.remove('open');
      document.getElementById('backdrop').classList.remove('visible');
    }
    
    function prevMonth() {
      currentMonth.setMonth(currentMonth.getMonth() - 1);
      renderMonthGrid();
    }
    
    function nextMonth() {
      currentMonth.setMonth(currentMonth.getMonth() + 1);
      renderMonthGrid();
    }
    
    // ============================================================================
    // WEEK VIEW - Table-based with frozen row/column
    // ============================================================================
    
    // Track collapsed state
    let collapsedSections = {
      meals: false,
      shopping: false,
      holiday: false
    };
    
    function toggleSection(sectionKey) {
      collapsedSections[sectionKey] = !collapsedSections[sectionKey];
      renderWeekView();
    }
    
    function renderWeekView() {
      // Determine start date based on view mode
      const startDate = daysCount === 7 ? currentWeekStart : currentPeriodStart;
      const endDate = addDays(startDate, daysCount - 1);
      
      // Update header label
      const startMonth = startDate.toLocaleDateString('en-US', { month: 'short' });
      const endMonth = endDate.toLocaleDateString('en-US', { month: 'short' });
      document.getElementById('weekLabel').textContent = 
        `${startMonth} ${startDate.getDate()} - ${endMonth} ${endDate.getDate()}, ${endDate.getFullYear()}`;
      
      // Build dates array
      const dates = [];
      for (let i = 0; i < daysCount; i++) {
        dates.push(addDays(startDate, i));
      }
      
      // Render colgroup
      const colgroup = document.getElementById('weekColgroup');
      colgroup.innerHTML = `<col class="label-col">`;
      for (let i = 0; i < daysCount; i++) {
        colgroup.innerHTML += `<col class="day-col">`;
      }
      
      // Render header row
      const thead = document.getElementById('weekTableHead');
      const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      let headerRow = '<tr><th class="corner-cell"></th>';
      dates.forEach(date => {
        const isToday = formatDate(date) === formatDate(today);
        headerRow += `
          <th class="day-header${isToday ? ' today' : ''}">
            <div class="week-day-name">${dayNames[date.getDay()]}</div>
            <div class="week-day-num">${date.getDate()}</div>
          </th>
        `;
      });
      headerRow += '</tr>';
      thead.innerHTML = headerRow;
      
      // Render body rows
      const tbody = document.getElementById('weekTableBody');
      let bodyHTML = '';
      
      // === MEALS ROW ===
      const mealsCollapsedClass = collapsedSections.meals ? ' collapsed' : '';
      bodyHTML += `<tr class="meals-row${mealsCollapsedClass}" id="mealsRow">`;
      bodyHTML += `<td class="row-label${mealsCollapsedClass}" onclick="toggleSection('meals')">
        <div class="label-content">
          <span class="collapse-icon">▼</span>
          <span>Meals</span>
        </div>
      </td>`;
      
      dates.forEach(date => {
        const dateStr = formatDate(date);
        const dayMeals = meals.filter(m => m.date === dateStr);
        bodyHTML += `<td class="content-cell"><div class="cell-content">`;
        dayMeals.forEach(m => {
          bodyHTML += `<div class="all-day-event meal">${getMealIcon(m.type)} ${m.desc}</div>`;
        });
        bodyHTML += `</div></td>`;
      });
      bodyHTML += '</tr>';
      
      // === SHOPPING ROW ===
      const shoppingCollapsedClass = collapsedSections.shopping ? ' collapsed' : '';
      const uncompletedShopping = shoppingItems.filter(s => !s.completed);
      
      bodyHTML += `<tr class="shopping-row${shoppingCollapsedClass}" id="shoppingRow">`;
      bodyHTML += `<td class="row-label${shoppingCollapsedClass}" onclick="toggleSection('shopping')">
        <div class="label-content">
          <span class="collapse-icon">▼</span>
          <span>Shopping</span>
        </div>
      </td>`;
      
      dates.forEach(date => {
        const isToday = formatDate(date) === formatDate(today);
        const dateStr = formatDate(date);
        bodyHTML += `<td class="content-cell"><div class="cell-content">`;
        
        // Shopping only shows on today
        if (isToday && uncompletedShopping.length > 0) {
          const maxToShow = 3;
          const itemsToShow = uncompletedShopping.slice(0, maxToShow);
          const remaining = uncompletedShopping.length - maxToShow;
          
          itemsToShow.forEach(s => {
            bodyHTML += `<div class="all-day-event shopping" onclick="event.stopPropagation(); alert('Navigate to Shopping List')">🛒 ${s.name}</div>`;
          });
          
          if (remaining > 0) {
            bodyHTML += `<div class="all-day-event shopping" style="opacity:0.7" onclick="event.stopPropagation(); alert('Navigate to Shopping List')">+${remaining} more</div>`;
          }
        }
        
        // All-day tasks
        tasks.filter(t => t.date === dateStr && !t.time).forEach(t => {
          bodyHTML += `<div class="all-day-event task-allday">✓ ${t.name}</div>`;
        });
        
        bodyHTML += `</div></td>`;
      });
      bodyHTML += '</tr>';
      
      // === HOLIDAY ROW ===
      const holidayCollapsedClass = collapsedSections.holiday ? ' collapsed' : '';
      
      bodyHTML += `<tr class="holiday-row${holidayCollapsedClass}" id="holidayRow">`;
      bodyHTML += `<td class="row-label${holidayCollapsedClass}" onclick="toggleSection('holiday')">
        <div class="label-content">
          <span class="collapse-icon">▼</span>
          <span>Holiday</span>
        </div>
      </td>`;
      
      dates.forEach(date => {
        const dateStr = formatDate(date);
        const dayHolidays = getHolidaysForDate(dateStr);
        bodyHTML += `<td class="content-cell"><div class="cell-content">`;
        dayHolidays.forEach(h => {
          bodyHTML += `<div class="all-day-event holiday" title="${h.helperName}'s ${h.type} leave (${h.startDate} to ${h.endDate})">🏖️ ${h.helperName}</div>`;
        });
        bodyHTML += `</div></td>`;
      });
      bodyHTML += '</tr>';
      
      // === TIME ROWS (7:00 - 20:00) ===
      for (let hour = 7; hour <= 20; hour++) {
        bodyHTML += `<tr class="time-row">`;
        bodyHTML += `<td class="row-label">${hour}:00</td>`;
        
        dates.forEach(date => {
          const dateStr = formatDate(date);
          const isToday = formatDate(date) === formatDate(today);
          bodyHTML += `<td class="content-cell${isToday ? ' today-col' : ''}" data-date="${dateStr}" data-hour="${hour}">`;
          
          // Find timed tasks for this hour
          const hourTasks = tasks.filter(t => {
            if (t.date !== dateStr || !t.time) return false;
            const [h] = t.time.split(':').map(Number);
            return h === hour;
          });
          
          hourTasks.forEach(t => {
            const [, mins] = t.time.split(':').map(Number);
            bodyHTML += `
              <div class="time-event" style="top: ${mins}px; height: 50px;">
                <div class="event-time">${t.time}</div>
                <div class="event-title">${t.name}</div>
              </div>
            `;
          });
          
          bodyHTML += `</td>`;
        });
        bodyHTML += '</tr>';
      }
      
      tbody.innerHTML = bodyHTML;
    }
    
    function getMealIcon(type) {
      switch(type) {
        case 'Breakfast': return '☀️';
        case 'Lunch': return '🌤️';
        case 'Dinner': return '🌙';
        case 'Snacks': return '🍪';
        default: return '🍽️';
      }
    }
    
    function prevPeriod() {
      if (daysCount === 7) {
        currentWeekStart = addDays(currentWeekStart, -7);
      } else {
        currentPeriodStart = addDays(currentPeriodStart, -daysCount);
      }
      renderWeekView();
    }
    
    function nextPeriod() {
      if (daysCount === 7) {
        currentWeekStart = addDays(currentWeekStart, 7);
      } else {
        currentPeriodStart = addDays(currentPeriodStart, daysCount);
      }
      renderWeekView();
    }
    
    // ============================================================================
    // DAY VIEW
    // ============================================================================
    
    function renderDayView() {
      const date = new Date(selectedDate);
      document.getElementById('dayViewDate').textContent = 
        date.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
      
      const dateStr = selectedDate;
      const dayTasks = tasks.filter(t => t.date === dateStr);
      const dayMeals = meals.filter(m => m.date === dateStr);
      const isToday = selectedDate === formatDate(today);
      const uncompletedShopping = shoppingItems.filter(s => !s.completed);
      
      let content = '';
      
      // Meals section
      if (dayMeals.length > 0) {
        content += `<div class="day-section">
          <div class="day-section-title">Meals</div>`;
        dayMeals.forEach(m => {
          content += `
            <div class="day-item">
              <div class="day-item-dot" style="background:var(--accent-orange)"></div>
              <div class="day-item-content">
                <div class="day-item-title">${m.desc}</div>
                <div class="day-item-meta">${m.type}</div>
              </div>
              <div class="day-item-time">${getMealIcon(m.type)}</div>
            </div>
          `;
        });
        content += '</div>';
      }
      
      // Tasks section
      if (dayTasks.length > 0) {
        content += `<div class="day-section">
          <div class="day-section-title">Tasks</div>`;
        dayTasks.sort((a, b) => (a.time || '99:99').localeCompare(b.time || '99:99')).forEach(t => {
          content += `
            <div class="day-item">
              <div class="day-item-dot" style="background:var(--accent-blue)"></div>
              <div class="day-item-content">
                <div class="day-item-title">${t.name}</div>
                <div class="day-item-meta">${t.assignee}</div>
              </div>
              <div class="day-item-time">${t.time || 'All day'}</div>
            </div>
          `;
        });
        content += '</div>';
      }
      
      // Shopping section (only on today)
      if (isToday && uncompletedShopping.length > 0) {
        content += `<div class="day-section">
          <div class="day-section-title">Shopping List</div>`;
        uncompletedShopping.forEach(s => {
          content += `
            <div class="day-item">
              <div class="day-item-dot" style="background:var(--accent-purple)"></div>
              <div class="day-item-content">
                <div class="day-item-title">${s.name}</div>
                <div class="day-item-meta">${s.category}</div>
              </div>
              <div class="day-item-time">🛒</div>
            </div>
          `;
        });
        content += '</div>';
      }
      
      if (!content) {
        content = '<div style="text-align:center;color:var(--text-muted);padding:40px">No events for this day</div>';
      }
      
      document.getElementById('dayViewContent').innerHTML = content;
    }
    
    // ============================================================================
    // TODAY BUTTON
    // ============================================================================
    
    function goToToday() {
      selectedDate = formatDate(today);
      currentMonth = new Date(today.getFullYear(), today.getMonth(), 1);
      currentWeekStart = getWeekStart(today);
      currentPeriodStart = addDays(today, -1); // For 3-day: yesterday, today, tomorrow
      
      if (currentView === 'month') renderMonthGrid();
      else if (currentView === 'week') renderWeekView();
      else if (currentView === 'day') renderDayView();
    }
    
    // ============================================================================
    // INIT
    // ============================================================================
    
    renderMonthGrid();
  </script>
</body>
</html>
